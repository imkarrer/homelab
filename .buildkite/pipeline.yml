# CI for the homelab flake (beads homelab-bqo.29). Before this pipeline
# existed, nothing evaluated nixosConfigurations.ac-box on push -- every gate
# was run by hand, and phase .25.13 removed ac-host's own full-system flake
# check, so the composed host config had no automated evaluation anywhere.
#
# Runs on ac-box's own self-hosted agent (BUILDKITE_AGENT_TAGS=queue=self --
# see modules/ci/default.nix's header), so the Nix store and the Flox/MinIO
# S3 substituter it already warms are reused: this build is mostly
# substitution, not compilation from source.
agents:
  queue: "self"

# Three kinds of build run this file, told apart by two variables:
#
#   - a push to homelab (the webhook): gates, then queue-closure. Every step
#     below EXCEPT the two trigger steps.
#   - a trigger from a tenant pipeline on green carrying HOMELAB_BUMP_INPUT
#     (ac-host, home-arcade; see their `trigger: homelab` steps): ONLY
#     bump-lock, which moves that input in flake.lock, runs the gates on
#     the result, and pushes. The pushed commit then arrives here as an
#     ordinary push build and is staged like any other. Splitting the two
#     keeps a trigger build from staging the pre-bump main sha over
#     whatever was already queued.
#   - a trigger from a flox tenant's pipeline on green carrying
#     HOMELAB_STAGE_ENVIRONMENT (agent-hub, arcade; ADR 0009): ONLY
#     queue-environment, which stages that tenant's sha (agent-hub) or
#     FloxHub generation (arcade: HOMELAB_STAGE_GENERATION +
#     HOMELAB_STAGE_ENV beside the sha) as its environment on the box.
#     No gate runs here -- the tenant's pipeline
#     is the gate for a flox tenant (ADR 0009, "The gate per flox tenant
#     is the tenant's") -- and nothing about the closure is staged.
#
# Part III row 24 in docs/architecture.md: bump-lock is the edge that makes
# "push to tenant -> reaches the box" true for module-only trees;
# queue-environment is the same edge for a tenant that is an environment.

steps:
  - label: ":arrow_up: bump-lock (a tenant went green)"
    if: build.env("HOMELAB_BUMP_INPUT") != null
    command: |
      bash scripts/hub-bump-lock.sh
    # Skips with a message until HOMELAB_PUSH_TOKEN reaches the agent's
    # environment (ac-host's compose/docker-compose.buildkite.yml passes it
    # from .env.buildkite). Provisioning that token is the operator's
    # enabling step, in the same sense homelab.deploy.enable was.

  # The staging half of ADR 0009's deploy edge (modules/tenant/
  # environment-pull.nix is the applying half). Writes
  # /var/lib/homelab/pending-environment-<tenant>.json and nothing else;
  # same mount, same skip-when-absent posture, same HAZARD 2 discipline as
  # queue-closure below. The tenant passes its own branch and build URL
  # because in a trigger build BUILDKITE_BRANCH is homelab's. A trigger's
  # `env:` block lands in this build's environment as-is, so the floxhub
  # kind's HOMELAB_STAGE_GENERATION / HOMELAB_STAGE_ENV (and the tree
  # kind's optional HOMELAB_STAGE_TREE) reach the script without being
  # named here; the script decides the record's kind from which are set.
  - label: ":inbox_tray: queue-environment (a flox tenant went green)"
    if: build.env("HOMELAB_STAGE_ENVIRONMENT") != null
    command: |
      bash scripts/hub-queue-environment.sh "$HOMELAB_STAGE_ENVIRONMENT" "$HOMELAB_STAGE_REV"

  - label: ":nix: flake check (ac-box + module eval harnesses)"
    if: build.env("HOMELAB_BUMP_INPUT") == null && build.env("HOMELAB_STAGE_ENVIRONMENT") == null
    command: |
      nix --extra-experimental-features "nix-command flakes" flake check -L --accept-flake-config
    # --accept-flake-config: the agent runs as root in its own container
    # with its own /nix, where cache.flox.dev is a TRUSTED substituter
    # (flox.conf) but not a default one. flake.nix names it in nixConfig so
    # this build can substitute flox (modules/platform/flox.nix) instead of
    # compiling it -- a Rust program with a bundled nix -- in batch.slice.
    # checks.${system}.ac-box (flake.nix) IS
    # nixosConfigurations.ac-box.config.system.build.toplevel -- the same
    # cheap gate flake.nix's own comment describes: catches a port
    # collision, a broken tenant module, or a bad lock bump before a human
    # opens a maintenance window.
    #
    # checks.${system}.eval-* are the module eval harnesses
    # (modules/*/tests/eval*.nix, via modules/tenant/tests/check.nix): the
    # unit-level coverage proving ports.nix still REJECTS a colliding
    # fixture, which the host config alone cannot exercise since ac-box has
    # no such fixture to reject. Until 12 Sep 2026 that ran as its own step
    # (./modules/ci/scripts/run-eval-tests.sh); now that every case is a
    # flake check, the step would have evaluated the same table twice. A
    # failing case is an evaluation error naming the case, so it surfaces
    # here before anything builds. The script survives as the way a human
    # gets the per-case report on demand.

  # Every gate above must be green before anything is staged. `wait: ~` is
  # what ac-host's pipeline does before queue-prod, and for the same reason:
  # a red gate must block the deploy candidate, not merely annotate it.
  - wait: ~

  # The staging half of ADR 0006. Writes /var/lib/homelab/pending-closure.json
  # and nothing else; the box's homelab-deploy.timer (modules/deploy) applies
  # it in the maintenance window. This step must NEVER run nixos-rebuild --
  # this agent is a unit of the closure being deployed (modules/ci HAZARD 2).
  #
  # Skips, with a message, when /var/lib/homelab is not writable: the agent
  # mounts it as of ac-host 2c5e9a0 but only picks the mount up when its
  # container is recreated. A green build stays green; the skip line is how
  # you know staging did not happen. Only main is staged (the script checks).
  - label: ":inbox_tray: queue-closure (stage rev for the 03:00 window)"
    if: build.env("HOMELAB_BUMP_INPUT") == null && build.env("HOMELAB_STAGE_ENVIRONMENT") == null
    command: |
      bash scripts/hub-queue-closure.sh
